name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Publish image runs the whole suite before it pushes anything.
  workflow_call:

permissions:
  contents: read

# Called from Publish image, github.workflow is the caller's name, so that run
# never cancels (or is cancelled by) the CI run for the same push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://kindo:kindo@127.0.0.1:5432/kindo?schema=public
  TEST_DATABASE_URL: postgresql://kindo:kindo@127.0.0.1:5432/kindo_test?schema=public
  # A second, empty database for the schema/migration drift check.
  SHADOW_DATABASE_URL: postgresql://kindo:kindo@127.0.0.1:5432/kindo_shadow?schema=public
  # A real CalDAV server (Radicale) for the Nextcloud tests, started below.
  CALDAV_TEST_URL: http://127.0.0.1:5232/
  CALDAV_TEST_USER: anna
  CALDAV_TEST_PASSWORD: app-password

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung download or server must fail the run, not hold it for GitHub's six-hour default.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: kindo
          POSTGRES_USER: kindo
          POSTGRES_PASSWORD: kindo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kindo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          # The major the Dockerfile runs in production.
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Start a CalDAV server (Radicale)
        run: |
          pip install --quiet "radicale==3.*"
          mkdir -p /tmp/radicale
          printf '[server]\nhosts = 127.0.0.1:5232\n[auth]\ntype = htpasswd\nhtpasswd_filename = /tmp/radicale/users\nhtpasswd_encryption = plain\n[storage]\nfilesystem_folder = /tmp/radicale/collections\n[rights]\ntype = owner_only\n' > /tmp/radicale/config
          echo "anna:app-password" > /tmp/radicale/users
          nohup python3 -m radicale --config /tmp/radicale/config > /tmp/radicale/log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS -u anna:app-password -X MKCALENDAR http://127.0.0.1:5232/anna/family/ -o /dev/null && exit 0
            sleep 1
          done
          cat /tmp/radicale/log
          exit 1

      - name: Validate the Prisma schema
        run: npx prisma validate

      - name: Create the shadow and test databases
        run: |
          PGPASSWORD=kindo psql -h 127.0.0.1 -U kindo -d kindo -c "CREATE DATABASE kindo_shadow"
          PGPASSWORD=kindo psql -h 127.0.0.1 -U kindo -d kindo -c "CREATE DATABASE kindo_test"

      - name: Schema/migration drift check
        run: npm run db:drift

      - name: Apply migrations to a fresh PostgreSQL
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        timeout-minutes: 10

      # The suite migrates and seeds its own database (kindo_e2e) before the server starts.
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          E2E_PORT: 3100

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: kindo
          POSTGRES_USER: kindo
          POSTGRES_PASSWORD: kindo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kindo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Build the app image
        run: docker build -t kindo:ci .

      - name: Build the migration image
        run: docker build -t kindo-migrate:ci --target migrate .

      # The two images together, as compose runs them: migrate (and load the
      # demo family) against a fresh database, then the app answers.
      - name: Migrate with the migration image
        run: >-
          docker run --rm --network host
          -e DATABASE_URL=${{ env.DATABASE_URL }}
          -e KINDO_DEMO=true
          kindo-migrate:ci

      - name: Migrating twice is harmless
        run: docker run --rm --network host -e DATABASE_URL=${{ env.DATABASE_URL }} -e KINDO_DEMO=true kindo-migrate:ci

      - name: The app image starts and is healthy
        run: |
          docker run -d --name kindo --network host -e DATABASE_URL=${{ env.DATABASE_URL }} -e KINDO_SECRET_KEY=ci-only-secret-key-0123456789abcdefghij kindo:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              # Signed out, a household page sends you to the sign-in page.
              curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:3000/wall | grep -q '/login' && exit 0
            fi
            sleep 2
          done
          docker logs kindo
          exit 1

      - name: The Docker healthcheck reports healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' kindo)
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "Health status: $status" >&2
          docker logs kindo
          exit 1

      - name: The runtime image must not carry the Prisma CLI
        run: |
          if docker run --rm --entrypoint sh kindo:ci -c 'test -e ./node_modules/prisma/build/index.js'; then
            echo "The Prisma CLI is present in the runtime image; it belongs only in the migrate image." >&2
            exit 1
          fi

      - name: The images run as a non-root user
        run: |
          test "$(docker run --rm --entrypoint id kindo:ci -u)" != "0"
          test "$(docker run --rm --entrypoint id kindo-migrate:ci -u)" != "0"
